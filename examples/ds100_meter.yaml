esphome:

uart:
  - id: rs485_smartmeter
    port: "/dev/serial/by-id/usb-WCH.CN_USB_Quad_Serial_BC622BABCD-if00"
    baud_rate: 115200
    data_bits: 8
    stop_bits: 1
    parity: NONE
    rx_buffer_size: 100

modbus:
  - id: modbus_smartmeter
    uart_id: rs485_smartmeter
    send_wait_time: 100ms
    role: client

external_components:
  - source: github://maringeph/esphome-custom-components@master
    components: [ds100_meter]

packages:
  - smartmeter_sv_eg_og: !include
      file: github://maringeph/esphome-custom-components/packages/ds100_meter/advanced.yaml@master
      vars:
        device_name: "SmartMeter SV EG+OG"
        device_id: smartmeter_sv_eg_og
        modbus_id: modbus_smartmeter
        modbus_address: "101"
