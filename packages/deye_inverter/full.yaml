        id: ${device_id}_bm1_temperature
      status:
        name: "${device_name}: BM1 Status"
        id: ${device_id}_bm1_status
      fault_code:
        name: "${device_name}: BM1 Fehlercode"
        id: ${device_id}_bm1_fault_code
      cycle_count:
        name: "${device_name}: BM1 Zyklen"
        id: ${device_id}_bm1_cycle_count
      capacity_remaining:
        name: "${device_name}: BM1 Kapazität Verbleibend"
        id: ${device_id}_bm1_capacity_remaining
      capacity_total:
        name: "${device_name}: BM1 Kapazität Gesamt"
        id: ${device_id}_bm1_capacity_total
      power:
        name: "${device_name}: BM1 Leistung"
        id: ${device_id}_bm1_power
      cell_max_voltage:
        name: "${device_name}: BM1 Zell Max Spannung"
        id: ${device_id}_bm1_cell_max_voltage
      cell_min_voltage:
        name: "${device_name}: BM1 Zell Min Spannung"
        id: ${device_id}_bm1_cell_min_voltage
      cell_max_temp:
