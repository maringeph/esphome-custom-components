# =============================================================================
# Deye Inverter Package - COMPLETE
# =============================================================================
# This package includes ALL 577 entities of the Deye inverter component.
#
# Verwendung in der Haupt-YAML:
#   packages:
#     wechselrichter_01:
#       !include
#         file: packages/deye_inverter/full.yaml
#         vars:
#           device_name: "Wechselrichter 01"
#           device_id: wr01
#           modbus_id: modbus_wr1
#           modbus_address: "1"
# =============================================================================

substitutions:
  device_name: "Deye Wechselrichter"
  device_id: deye_wr
  modbus_id: modbus_deye
  modbus_address: "1"

# Gerätedefinition
esphome:
  devices:
    - name: ${device_name}
      id: device_${device_id}

# =============================================================================
# SENSOREN - ALLE ENTITIES AKTIVIERT
# =============================================================================
sensor:
  - platform: deye_inverter
    id: ${device_id}
    device_id: device_${device_id}
    modbus_id: ${modbus_id}
    address: ${modbus_address}

    # Update Intervalle
    update_interval_live: 1s
    update_interval_statistics: 5s
    update_interval_device_info: 60s

    # =========================================================================
    # DEVICE INFO (2 entities) - Static values, read once
    # =========================================================================
    device_info:
      device_type:
        name: "${device_name}: Gerätetyp"
        id: ${device_id}_device_type
      modbus_address:
        name: "${device_name}: Modbus Adresse"
        id: ${device_id}_modbus_address

    # =========================================================================
    # BATTERIE (6 entities)
    # =========================================================================
    battery:
      voltage:
        name: "${device_name}: Batterie Spannung"
        id: ${device_id}_battery_voltage
      current:
        name: "${device_name}: Batterie Strom"
        id: ${device_id}_battery_current
      power:
        name: "${device_name}: Batterie Leistung"
        id: ${device_id}_battery_power
      soc:
        name: "${device_name}: Batterie SOC"
        id: ${device_id}_battery_soc
      temperature:
        name: "${device_name}: Batterie Temperatur"
        id: ${device_id}_battery_temperature
      capacity:
        name: "${device_name}: Batterie Kapazität"
        id: ${device_id}_battery_capacity

    # =========================================================================
    # BATTERY MODULE 1 (14 entities) - Primary module, enabled by default
    # =========================================================================
    battery_module_1:
      voltage:
        name: "${device_name}: BM1 Spannung"
        id: ${device_id}_bm1_voltage
      current:
        name: "${device_name}: BM1 Strom"
        id: ${device_id}_bm1_current
      soc:
        name: "${device_name}: BM1 SOC"
        id: ${device_id}_bm1_soc
      temperature:
