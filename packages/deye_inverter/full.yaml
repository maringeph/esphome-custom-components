# =============================================================================
# SELECT - ALLE (12 entities)
# =============================================================================
select:
  - platform: deye_inverter
    deye_inverter_id: ${device_id}
    device_id: device_${device_id}

    # -------------------------------------------------------------------------
    # SETTINGS GRID (5 entities) - Grid configuration
    # -------------------------------------------------------------------------
    settings_grid:
      grid_type:
        name: "${device_name}: Netz-Typ"
        id: ${device_id}_grid_type
      grid_mode:
        name: "${device_name}: Netz-Modus"
        id: ${device_id}_grid_mode
      grid_nominal_voltage:
        name: "${device_name}: Grid Nennspannung"
        id: ${device_id}_grid_nominal_voltage
      grid_nominal_frequency:
        name: "${device_name}: Grid Nennfrequenz"
        id: ${device_id}_grid_nominal_frequency
      grid_phase_sequence:
        name: "${device_name}: Grid Phasenfolge"
        id: ${device_id}_grid_phase_sequence
      grid_check_source:
        name: "${device_name}: Grid Messung"
        id: ${device_id}_grid_check_source

    # -------------------------------------------------------------------------
    # SETTINGS WORKING MODE (2 entities) - Energy priority and limit control
    # -------------------------------------------------------------------------
    settings_working_mode:
      energy_priority:
        name: "${device_name}: Energie-Priorität"
        id: ${device_id}_energy_priority
      limit_control_mode:
        name: "${device_name}: Limit Steuerungsmodus"
        id: ${device_id}_limit_control_mode

    # -------------------------------------------------------------------------
    # SETTINGS BATTERY (2 entities) - Battery type and control mode
    # -------------------------------------------------------------------------
    settings_battery:
      battery_type:
        name: "${device_name}: Batterie-Typ"
        id: ${device_id}_battery_type
      battery_control_mode:
        name: "${device_name}: Batterie-Steuerung"
        id: ${device_id}_battery_control_mode

    # -------------------------------------------------------------------------
    # SETTINGS GEN PORT (1 entity) - Generator Port Control Mode
    # -------------------------------------------------------------------------
    settings_gen_port:
      gen_port_control_mode:
        name: "${device_name}: Gen Port Modus"
        id: ${device_id}_gen_port_control_mode

    # -------------------------------------------------------------------------
    # SETTINGS SYSTEM TIME (1 entity)
    # -------------------------------------------------------------------------
    settings_system_time:
      system_time:
        name: "${device_name}: Systemzeit"
        id: ${device_id}_settings_system_time

# =============================================================================
# TIME - System Time Synchronization
# =============================================================================
time:
  - platform: deye_inverter
    id: ${device_id}_system_time
    deye_inverter_id: ${device_id}
    # Sync triggered automatically when Settings are read (every 2 minutes)
    # Only writes if: local time was just set OR difference > max_time_diff
    # max_time_diff: 0s = auto sync disabled (only sync on time change/DST)
    max_time_diff: 10s # Sync if difference > 10 seconds


    # Actions available:
    # - deye_inverter.write_time: Manually write time to inverter
    #   Example: on_boot -> then: deye_inverter.write_time
    #   Or: button.press -> then: deye_inverter.write_time

